# PatchRetrieval Configuration for CCS Dataset

# Data settings
data:
  # CCS dataset paths
  cell_cls_root: "/home/rliuar/2_Official/CCS-Cell-Cls"
  cell_det_root: "/home/rliuar/2_Official/CCS-Cell-Det"
  processed_data_dir: "data/derived"
  
  # Root directory for query images
  # Script will look for queries in {queries_root}/{category}/
  queries_root: "data/queries/split"
  
  # Query split mode:
  # false: Use all queries from {queries_root}/{category}/ for both train and val (original mode)
  # true: Use {queries_root}/{category}/train/ for training, {queries_root}/{category}/val/ for validation
  split_queries: true

  # Image settings
  # Note: Should match the model's expected input size
  # CLIP: 224, SigLIP2-256: 256, SigLIP2-384: 384, DINOv3: 224
  image_size: 224  # resize images to this size for ViT
  
  # Augmentation settings for query images (only applied during training)
  use_augmentation: false
  augmentation:
    rotation_degrees: 10  # ±degrees for rotation
    color_jitter:
      brightness: 0.15
      contrast: 0.15
      saturation: 0.15
      hue: 0.05
    horizontal_flip_prob: 0.3
    vertical_flip_prob: 0.3
  
  # Data split (for preprocessing)
  train_ratio: 0.7
  val_ratio: 0.1
  test_ratio: 0.2
  seed: 42

# Target categories (in severity order, low to high)
categories:
  - "ASC-US"
  - "LSIL"
  - "ASC-H"
  - "HSIL"
  - "SCC"

# Severity mapping (higher = more severe, for reference)
severity:
  ASC-US: 1
  LSIL: 2
  ASC-H: 3
  HSIL: 4
  SCC: 5

# Model settings
model:
  # Backbone options:
  #   CLIP: "openai/clip-vit-base-patch16", "openai/clip-vit-large-patch14"
  #   SigLIP2: "google/siglip2-base-patch16-224", "google/siglip2-large-patch16-256",
  #            "google/siglip2-so400m-patch14-384", etc.
  #   (See https://huggingface.co/collections/google/siglip2-67b5dcef38c175486e240107)
  #   DINOv3: "facebook/dinov3-vits16-pretrain-lvd1689m", "facebook/dinov3-vitb16-pretrain-lvd1689m",
  #           "facebook/dinov3-vitl16-pretrain-lvd1689m", "facebook/dinov3-vitg16-pretrain-lvd1689m",
  #           "facebook/dinov3-vitsplus-pretrain-lvd1689m", "facebook/dinov3-vit7b16-pretrain-lvd1689m"
  #   (See https://huggingface.co/collections/facebook/dinov3-68924841bd6b561778e31009)
  #   DINOv3 (local): "/ssddata/hjiangaz/rliuar/0_Official/huggingface/hub/dinov3-vitb16-pretrain-lvd1689m"
  backbone: "/home/rliuar/2_Official/dinov3-vitb16-pretrain-lvd1689m"
  embed_dim: 768
  cache_dir: "/home/rliuar/0_Storage/hf_home/hub"
  
  # Pooling method for patch-query similarity
  # Options: "softmax_attn" (attention weighted), "mean" (average), "max" (maximum)
  pooling_method: "softmax_attn"
  
  # Dropout rate for regularization (applied after embeddings)
  dropout: 0.2

# Training settings
training:
  batch_size: 8
  num_epochs: 10
  learning_rate: 3e-6  # 2e-5
  weight_decay: 0.01
  warmup_epochs: 1
  num_negatives: 63
  
  # Temperature (learnable)
  init_temperature: 0.07
  min_temperature: 0.01
  max_temperature: 1.0
  
  # Ordinal contrastive loss: adds margin to negative similarities based on pathology severity
  # small severity distance -> large margin (pushes "similar" negatives further away)
  # Set to 0.0 to disable, suggested: 0.1-0.3
  ordinal_margin_base: 0.2
  
  # Optimizer
  optimizer: "adamw"
  betas: [0.9, 0.999]
  
  # Scheduler
  scheduler: "cosine"
  
  # Checkpointing
  save_every: 1  # Save every epoch since we only train 5 epochs
  save_best: true
  # Metric to use for saving best model: "loss" (lower is better) or "mAP" (higher is better)
  save_best_metric: "mAP"
  
  # Early stopping (optional)
  early_stopping_patience: 3  # Stop if val loss doesn't improve for 3 validations
  
  # Validation strategy
  # "epoch": Run validation at the end of each epoch
  # "step": Run validation every N training steps
  val_strategy: "epoch"  # Changed to epoch for better monitoring
  val_every_steps: 80  # Only used when val_strategy is "step"
  # Validation mode
  # "batch": in-batch contrastive validation (fast)
  # "full": full retrieval over val positives/negatives (same as testing)
  validation_mode: "full"
  # Optional batch size for full validation
  # val_batch_size: 64

# Logging
logging:
  log_dir: "logs"
  tensorboard: true
  log_every: 10
